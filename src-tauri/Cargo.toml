[package]
name = "lumaschedule"
version = "0.1.0"
description = "Open-source local-first course schedule application"
authors = ["LumaSchedule Contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "lumaschedule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
schedule-core = { path = "../crates/schedule-core" }
schedule-import = { path = "../crates/schedule-import" }
schedule-adapter = { path = "../crates/schedule-adapter" }

uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"

chrono = { version = "0.4", features = ["serde"] }
