name: Bug report
description: 报告崩溃、导入失败、界面异常或高校兼容问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可以复现问题的信息；不要提交教务账号、密码、Cookie 或其他敏感数据。
  - type: input
    id: version
    attributes:
      label: LumaSchedule 版本
      placeholder: 例如 v0.1.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 启动 / 崩溃
        - 高校教务导入
        - 文件导入 / 导出
        - 周课表 / 今日课程
        - 成绩 / GPA
        - 提醒 / 小组件
        - 设置 / 外观
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      placeholder: 发生了什么？你原本期望发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
      placeholder: 例如 Redmi / Android 15
  - type: textarea
    id: logs
    attributes:
      label: 截图或日志
      description: 可拖入截图或粘贴必要日志。请先移除账号、Cookie、学号等敏感信息。
