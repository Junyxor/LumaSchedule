name: Android Native

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build signed Release APK/AAB (requires Android signing secrets)'
        required: false
        type: boolean
        default: false

jobs:
  test-release-apk:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Shiguang adapter warehouse
        uses: actions/checkout@v4
        with:
          repository: XingHeYuZhuan/shiguang_warehouse
          ref: main
          path: .upstream/shiguang_warehouse
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm install
      - name: Bundle current university adapters
        env:
          SHIGUANG_SOURCE: .upstream/shiguang_warehouse
        run: node scripts/sync-shiguang-adapters.mjs
      - name: Build Svelte assets
        run: npm run build
      - name: Create ephemeral test signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/lumaschedule-test.jks" \
            -storepass lumaschedule-test \
            -keypass lumaschedule-test \
            -alias lumaschedule-test \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=LumaSchedule Test, OU=CI, O=LumaSchedule, L=Guangzhou, ST=Guangdong, C=CN"
      - name: Build native Release APK
        env:
          LUMA_KEYSTORE_PATH: ${{ runner.temp }}/lumaschedule-test.jks
          LUMA_KEY_ALIAS: lumaschedule-test
          LUMA_KEY_PASSWORD: lumaschedule-test
          LUMA_STORE_PASSWORD: lumaschedule-test
        run: gradle -p android-native :app:assembleRelease --no-daemon --stacktrace
      - name: Report APK size
        shell: bash
        run: |
          find android-native/app/build/outputs/apk -name '*.apk' -type f -print0 | xargs -0 -r ls -lh
          find android-native/app/build/outputs/apk -name '*.apk' -type f -printf '%p %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: lumaschedule-android-native-test-release
          path: android-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  signed-release:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Shiguang adapter warehouse
        uses: actions/checkout@v4
        with:
          repository: XingHeYuZhuan/shiguang_warehouse
          ref: main
          path: .upstream/shiguang_warehouse
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm install
      - name: Bundle current university adapters
        env:
          SHIGUANG_SOURCE: .upstream/shiguang_warehouse
        run: node scripts/sync-shiguang-adapters.mjs
      - run: npm run build
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::ANDROID_KEY_PASSWORD is missing" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::ANDROID_STORE_PASSWORD is missing" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumaschedule-release.jks"
          test -s "$RUNNER_TEMP/lumaschedule-release.jks" || (echo "::error::Decoded Android keystore is empty" && exit 1)
      - name: Build signed native APK and AAB
        env:
          LUMA_KEYSTORE_PATH: ${{ runner.temp }}/lumaschedule-release.jks
          LUMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LUMA_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: gradle -p android-native :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Report release sizes
        shell: bash
        run: |
          find android-native/app/build/outputs \( -name '*.apk' -o -name '*.aab' \) -type f -print0 | xargs -0 -r ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: lumaschedule-android-native-release
          path: |
            android-native/app/build/outputs/apk/release/*.apk
            android-native/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
