name: Android

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build signed Release APK/AAB (requires Android signing secrets)'
        required: false
        type: boolean
        default: false

jobs:
  debug-apk:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Shiguang adapter warehouse
        uses: actions/checkout@v4
        with:
          repository: XingHeYuZhuan/shiguang_warehouse
          ref: main
          path: .upstream/shiguang_warehouse
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK / NDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Export NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - name: Bundle current university adapters
        env:
          SHIGUANG_SOURCE: .upstream/shiguang_warehouse
        run: node scripts/sync-shiguang-adapters.mjs
      - run: npx tauri android init --ci --skip-targets-install
      - run: npx tauri icon assets/app-icon.svg
      - name: Restore optional Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Firebase Android config not configured; continuing without google-services.json."
            exit 0
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > src-tauri/gen/android/app/google-services.json
          test -s src-tauri/gen/android/app/google-services.json || (echo "::error::Decoded google-services.json is empty" && exit 1)
      - run: node scripts/prepare-android-ci.mjs
      - run: npx tauri android build --debug --apk --ci
      - uses: actions/upload-artifact@v4
        with:
          name: lumaschedule-android-debug
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error

  signed-release:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Shiguang adapter warehouse
        uses: actions/checkout@v4
        with:
          repository: XingHeYuZhuan/shiguang_warehouse
          ref: main
          path: .upstream/shiguang_warehouse
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK / NDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Export NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - name: Bundle current university adapters
        env:
          SHIGUANG_SOURCE: .upstream/shiguang_warehouse
        run: node scripts/sync-shiguang-adapters.mjs
      - run: npx tauri android init --ci --skip-targets-install
      - run: npx tauri icon assets/app-icon.svg
      - name: Restore optional Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Firebase Android config not configured; continuing without google-services.json."
            exit 0
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > src-tauri/gen/android/app/google-services.json
          test -s src-tauri/gen/android/app/google-services.json || (echo "::error::Decoded google-services.json is empty" && exit 1)
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::ANDROID_KEY_PASSWORD is missing" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::ANDROID_STORE_PASSWORD is missing" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumaschedule-release.jks"
          test -s "$RUNNER_TEMP/lumaschedule-release.jks" || (echo "::error::Decoded Android keystore is empty" && exit 1)
          cat > src-tauri/gen/android/keystore.properties <<EOF2
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          storeFile=$RUNNER_TEMP/lumaschedule-release.jks
          EOF2
      - run: node scripts/prepare-android-ci.mjs --signing
      - run: npx tauri android build --apk --aab --ci
      - uses: actions/upload-artifact@v4
        with:
          name: lumaschedule-android-release
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error
