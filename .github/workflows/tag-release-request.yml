name: Tag Release Request

on:
  push:
    branches: [main]
    paths:
      - '.github/release-request.json'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create/update release tag metadata and dispatch Android release workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const request = JSON.parse(fs.readFileSync('.github/release-request.json', 'utf8'));
            const version = String(request.version || '').trim();
            const target = String(request.target || '').trim();
            const title = String(request.title || `LumaSchedule v${version}`).trim();
            const notes = String(request.notes || '').trim();
            const tagMessage = String(request.tagMessage || notes || title).trim();
            const metadataOnly = Boolean(request.metadataOnly);
            const prerelease = Boolean(request.prerelease);

            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              core.setFailed(`Invalid version: ${version}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/i.test(target)) {
              core.setFailed(`Invalid target commit: ${target}`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `v${version}`;

            const targetCommit = await github.rest.repos.getCommit({ owner, repo, ref: target });
            if (targetCommit.data.sha !== target) {
              core.setFailed(`Target commit not found: ${target}`);
              return;
            }

            let existingRef = null;
            try {
              existingRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const annotated = await github.rest.git.createTag({
              owner,
              repo,
              tag,
              message: tagMessage,
              object: target,
              type: 'commit'
            });

            if (!existingRef) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: annotated.data.sha
              });
              core.info(`Created annotated ${tag} -> ${target}`);
            } else {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha: annotated.data.sha,
                force: true
              });
              core.info(`Updated annotated metadata for ${tag}; target remains ${target}`);
            }

            let release = null;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (release) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.data.id,
                tag_name: tag,
                target_commitish: target,
                name: title,
                body: notes || release.data.body || '',
                draft: false,
                prerelease
              });
              core.info(`Updated GitHub Release metadata for ${tag}`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: title,
                body: notes,
                draft: false,
                prerelease
              });
              core.info(`Created GitHub Release metadata for ${tag}`);
            }

            if (!metadataOnly) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'android.yml',
                ref: tag,
                inputs: {
                  release: 'true',
                  version
                }
              });
              core.info(`Dispatched Android Native signed release for ${tag}`);
            } else {
              core.info(`Metadata-only refresh completed for ${tag}; Android rebuild skipped.`);
            }
