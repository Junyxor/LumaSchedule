name: Tag Release Request

on:
  push:
    branches: [main]
    paths:
      - '.github/release-request.json'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release tag and dispatch Android release workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const request = JSON.parse(fs.readFileSync('.github/release-request.json', 'utf8'));
            const version = String(request.version || '').trim();
            const target = String(request.target || '').trim();
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setFailed(`Invalid version: ${version}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/i.test(target)) {
              core.setFailed(`Invalid target commit: ${target}`);
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `v${version}`;

            const targetCommit = await github.rest.repos.getCommit({ owner, repo, ref: target });
            if (targetCommit.data.sha !== target) {
              core.setFailed(`Target commit not found: ${target}`);
              return;
            }

            let existing = null;
            try {
              existing = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!existing) {
              const annotated = await github.rest.git.createTag({
                owner,
                repo,
                tag,
                message: `LumaSchedule ${tag}`,
                object: target,
                type: 'commit'
              });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: annotated.data.sha
              });
              core.info(`Created ${tag} -> ${target}`);
            } else {
              core.info(`${tag} already exists; leaving it unchanged.`);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'android.yml',
              ref: tag,
              inputs: {
                release: 'true',
                version
              }
            });
            core.info(`Dispatched Android Native signed release for ${tag}`);
