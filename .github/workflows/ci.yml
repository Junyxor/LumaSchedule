name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/prepare-android-ci.mjs
      - run: npm run build
      - run: npm run check

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test -p schedule-core -p schedule-import -p schedule-adapter
      - name: Check Tauri app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo check -p lumaschedule 2>&1 | tee /tmp/luma-cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo '### `cargo check -p lumaschedule` concise diagnostics'
              echo
              echo '```text'
              grep -E '^(error(\[[A-Z0-9]+\])?:|[[:space:]]*--> src-tauri/|[[:space:]]*\||help:|note: required)' /tmp/luma-cargo-check.log | tail -n 120
              echo '```'
            } > /tmp/luma-cargo-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/luma-cargo-comment.md || true
          fi
          exit "$status"
