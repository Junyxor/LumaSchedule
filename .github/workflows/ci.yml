name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/sync-shiguang-adapters.mjs
      - run: node --check scripts/validate-shiguang-contract.mjs
      - run: node --check scripts/convert-wakeup-school-info.mjs
      - run: node scripts/test-wakeup-school-info.mjs
      - run: npm run build
      - run: npm run check
