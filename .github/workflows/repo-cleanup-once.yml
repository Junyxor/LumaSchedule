name: Repository Cleanup (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-cleanup-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'chore/android-size'
            'feat/android-native-core'
            'feat/android-native-core-v2'
            'feat/v0.1-bootstrap'
            'fix/mobile-v0.1'
            'temp/native-stage'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting branch: $branch"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "::warning::Could not delete $branch (it may already be gone)."
            fi
          done

      - name: Delete failed and cancelled Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$RUNNER_TEMP/obsolete-runs.txt"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&status=completed" \
            --jq '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "startup_failure") | .id' \
            > "$ids"
          count="$(wc -l < "$ids" | tr -d ' ')"
          echo "Deleting $count obsolete workflow runs."
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            echo "Deleting Actions run: $run_id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || echo "::warning::Could not delete run $run_id."
          done < "$ids"

      - name: Confirm retained branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
