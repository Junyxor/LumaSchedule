name: Bootstrap PR Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test -p schedule-core -p schedule-import -p schedule-adapter
      - run: cargo check -p lumaschedule

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Shiguang adapter warehouse
        uses: actions/checkout@v4
        with:
          repository: XingHeYuZhuan/shiguang_warehouse
          ref: main
          path: .upstream/shiguang_warehouse
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK / NDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Export NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - name: Bundle current university adapters
        env:
          SHIGUANG_SOURCE: .upstream/shiguang_warehouse
        run: node scripts/sync-shiguang-adapters.mjs
      - run: npx tauri android init --ci --skip-targets-install
      - run: npx tauri icon assets/app-icon.svg
      - run: node scripts/prepare-android-ci.mjs
      - run: npx tauri android build --debug --apk --ci
