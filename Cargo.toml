[workspace]
resolver = "2"
members = [
  "crates/schedule-core",
  "crates/schedule-import",
  "crates/schedule-adapter",
  "src-tauri"
]

# LumaSchedule is a small utility app: prefer compact release binaries over
# maximum compiler throughput. Debug/profile tuning stays in CI so local
# development still keeps useful symbols.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
