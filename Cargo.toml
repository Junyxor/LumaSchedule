[workspace]
resolver = "2"
members = [
  "crates/schedule-core",
  "crates/schedule-import",
  "crates/schedule-adapter",
  "src-tauri"
]

# Keep local/debug builds usable without shipping huge DWARF sections in test APKs.
[profile.dev]
opt-level = 1
debug = 0
strip = "debuginfo"

# LumaSchedule is a small utility app. Optimize shipped Rust code for minimum size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
