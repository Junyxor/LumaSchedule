[workspace]
resolver = "2"
members = [
  "crates/schedule-core",
  "crates/schedule-import",
  "crates/schedule-adapter",
  "src-tauri"
]

# Keep test/dev binaries useful but do not ship hundreds of MB of Rust debug
# symbols inside Android APKs. Backtraces still retain symbol names.
[profile.dev]
opt-level = 1
debug = 0
strip = "debuginfo"

# LumaSchedule is a small utility app: prefer compact release binaries.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
